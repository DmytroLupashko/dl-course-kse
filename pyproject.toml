grad-cam = "^1.5.5"
ttach = "^0.0.3"
hyperopt = "^0.2.7"
lightgbm = "^4.7.0"
mlflow = "^3.16.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
