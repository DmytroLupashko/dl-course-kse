[tool.poetry.dependencies]
python = ">=3.14,<3.14.1 || >3.14.1,<3.15"
jupyterlab = "^4.4.6"
numpy = "^2.3.0"
torch = "^2.13.0"
torchvision = "^0.28.0"
torchaudio = "^2.11.0"
audiomentations = "^0.43.1"
torch-audiomentations = "^0.12.0"
transformers = "^4.56.0"
tensorboardx = "^2.6.4"
scikit-learn = "^1.7.1"
kaggle = "^1.7.4.5"
pandas = "^2.3.2"
scipy = "^1.12.0"
seaborn = "^0.13.2"
timm = "^1.0.20"
ipywidgets = "^8.1.7"
mir-eval = "^0.8.2"
pyarrow = "^25.0.1"
h5py = "^3.14.0"
albumentations = "^2.0.8"
lightning = "^2.5.4"
datasets = "^4.0.0"
ipdb = "^0.13.13"
accelerate = "^1.10.1"
jsonlines = "^4.0.0"
nltk = "^3.9.1"
confidence-intervals = "^0.0.3"
graphviz = "^0.21"
torchviz = "^0.0.3"
torchview = "^0.2.7"
wandb = "^0.21.3"
torchmetrics = "^1.8.1"
inflect = "^7.5.0"
unidecode = "^1.4.0"
